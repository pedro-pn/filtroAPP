resolver 127.0.0.11 valid=30s ipv6=off;

# O worker do PDF.js é um módulo .mjs; o navegador exige um MIME JavaScript.
types {
  application/javascript mjs;
}

# O Caddy termina TLS e encaminha o IP do visitante. Confie somente nesse
# container; outros participantes da proxy-net não podem forjar a allowlist.
set_real_ip_from infra-proxy-caddy;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# A conexão Caddy -> Nginx é HTTP; preserve o HTTPS usado pelo visitante.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

# STAGING_ALLOWED_IPS vem de backend/.env.staging. O entrypoint gera o include.
# Qualquer IP não listado receberá 403, inclusive quando a variável estiver vazia.
geo $staging_allowed {
    default         0;
    127.0.0.1       1;
    ::1             1;
    include /etc/nginx/staging-allowed-ips.conf;
}

server {
  listen 80;
  server_name filtrostaging.filtrovali.com.br;

  root /usr/share/nginx/html;

  # PDFs de relatório de 50 MiB chegam em base64 no corpo JSON.
  client_max_body_size 270M;

  # Bloqueia IPs não autorizados antes de qualquer processamento.
  if ($staging_allowed = 0) {
    return 403;
  }

  # Cabeçalho para identificar respostas do ambiente de homologação.
  add_header X-Environment "staging" always;

  location /api/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location = /api {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /assets/ {
    try_files $uri @backend;
  }

  location /uploads/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /relatorios/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /certificados-calibracao/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location = /health {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location @backend {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }
}
