<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Recarrega sozinha: quando a manutenção termina, o app volta sem ação do usuário. -->
  <meta http-equiv="refresh" content="30">
  <title>Filtrovali em manutenção</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f6f3; --card: #ffffff; --text: #1f2a22; --muted: #5b6b60; --brand: #30503a; --ring: rgba(48, 80, 58, .18); }
    @media (prefers-color-scheme: dark) { :root { --bg: #121714; --card: #1b221d; --text: #e7ece8; --muted: #a3b1a7; --brand: #7fb28d; --ring: rgba(127, 178, 141, .22); } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 440px; background: var(--card); border-radius: 16px; padding: 32px 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, .08); text-align: center; }
    img { max-width: 180px; height: auto; margin: 0 auto 20px; display: block; }
    .pulse { width: 14px; height: 14px; margin: 0 auto 16px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 0 var(--ring); animation: pulse 1.8s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 14px rgba(0, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 10px; color: var(--muted); }
    .note { font-size: .9rem; }
  </style>
</head>
<body>
  <main aria-labelledby="maintenance-title">
    <img src="/assets/Logo/LOGO_LOGIN.png" alt="Filtrovali">
    <div class="pulse" aria-hidden="true"></div>
    <h1 id="maintenance-title">Sistema em atualização</h1>
    <p>Estamos publicando uma nova versão do sistema. O acesso volta em poucos minutos.</p>
    <p class="note">Esta página se atualiza sozinha. Se você estava preenchendo um relatório em outra aba, aguarde alguns minutos e tente salvar de novo.</p>
  </main>
</body>
</html>
