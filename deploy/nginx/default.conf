resolver 127.0.0.11 valid=30s ipv6=off;

# O worker do PDF.js é um módulo .mjs; o navegador exige um MIME JavaScript.
types {
  application/javascript mjs;
}

# Não expor a versão do nginx nas respostas/erros (F-02).
server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/plain
  text/xml;

# Este nginx NAO termina mais TLS nem publica portas no host. Quem faz isso e o
# infra-proxy (Caddy), em repositorio independente. Veja deploy/INFRA-PROXY.md.
# Aqui so se serve HTTP interno.
# Consequencia: nenhum bloco pode redirecionar para https://$host, senao o
# proxy entra em loop de redirect.

# O cliente real vem no X-Forwarded-For posto pelo Caddy. Sem isto, $remote_addr
# seria sempre o IP do proxy (logs e rate limit ficariam inuteis).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# $scheme aqui e sempre "http". O esquema que o cliente usou vem do Caddy; sem
# este map o backend receberia X-Forwarded-Proto: http e poderia gerar URLs
# absolutas erradas ou recusar cookies Secure.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      https;
}

# Modo manutenção em runtime: com o arquivo /maintenance/on (pasta do host montada
# só leitura; veja deploy/maintenance.sh), o nginx responde 503 sem tocar no
# backend. API recebe JSON; o resto, a página estática de manutenção.
map $uri $maintenance_page {
  ~^/api(/|$)  /__maintenance/api.json;
  default      /__maintenance/index.html;
}

map $uri $static_cache_control {
  default "";
  "/index.html" "no-cache";
  "/app-version.json" "no-store";
  ~^/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;

  # PDFs de assinatura de 200 MiB também podem chegar em base64 no JSON.
  client_max_body_size 270M;

  # Cabeçalhos de segurança (F-01). `always` garante que se apliquem também às
  # respostas do backend via proxy e a respostas de erro.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "DENY" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self)" always;
  add_header Cache-Control              $static_cache_control always;
  # CSP: validar em staging. A app usa blob:/data: para imagens e assinaturas; o
  # Vite pode injetar estilos inline. Evoluir para nonce/hash e remover 'unsafe-inline'.
  add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # Manutenção. Ficam de fora: conferências internas (127.0.0.1, usadas pelo
  # healthcheck e pelo deploy-prod.sh via `compose exec nginx wget`), /nginx-health,
  # os arquivos estáticos (logo da página) e a própria página de manutenção (o
  # error_page é um redirect interno e passa de novo por estes `if`).
  set $maintenance "";
  if (-f /maintenance/on) {
    set $maintenance "on";
  }
  # $realip_remote_addr é o endereço da conexão (antes do X-Forwarded-For): um
  # cliente não consegue se passar por 127.0.0.1 mandando o cabeçalho.
  if ($realip_remote_addr = 127.0.0.1) {
    set $maintenance "";
  }
  if ($uri ~ ^/(nginx-health$|assets/|__maintenance/)) {
    set $maintenance "";
  }
  if ($maintenance = "on") {
    return 503;
  }
  error_page 503 $maintenance_page;

  # Respostas de manutenção. `add_header` num location descarta os do server, por
  # isso os cabeçalhos de segurança se repetem aqui (o teste
  # backend/test/nginx-maintenance-config.test.js confere que são os mesmos).
  location = /__maintenance/index.html {
    internal;
    alias /usr/share/nginx/maintenance/index.html;
    types { }
    default_type "text/html; charset=utf-8";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control             "no-store" always;
    add_header Retry-After               "120" always;
  }

  location = /__maintenance/api.json {
    internal;
    alias /usr/share/nginx/maintenance/api.json;
    types { }
    default_type application/json;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control             "no-store" always;
    add_header Retry-After               "120" always;
  }

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location = /api {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /assets/ {
    try_files $uri @backend;
  }

  location = /index.html { }

  location /uploads/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /relatorios/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /certificados-calibracao/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location = /health {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location @backend {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }
}
