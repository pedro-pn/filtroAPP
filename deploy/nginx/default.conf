resolver 127.0.0.11 valid=30s ipv6=off;

# Não expor a versão do nginx nas respostas/erros (F-02).
server_tokens off;

# Este nginx NAO termina mais TLS nem publica portas no host. Quem faz isso e o
# infra-proxy (Caddy), em deploy/infra-proxy/. Aqui so se serve HTTP interno.
# Consequencia: nenhum bloco pode redirecionar para https://$host, senao o
# proxy entra em loop de redirect.

# O cliente real vem no X-Forwarded-For posto pelo Caddy. Sem isto, $remote_addr
# seria sempre o IP do proxy (logs e rate limit ficariam inuteis).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# $scheme aqui e sempre "http". O esquema que o cliente usou vem do Caddy; sem
# este map o backend receberia X-Forwarded-Proto: http e poderia gerar URLs
# absolutas erradas ou recusar cookies Secure.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      https;
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;

  client_max_body_size 30M;

  # Cabeçalhos de segurança (F-01). `always` garante que se apliquem também às
  # respostas do backend via proxy e a respostas de erro.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "DENY" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
  # CSP: validar em staging. A app usa blob:/data: para imagens e assinaturas; o
  # Vite pode injetar estilos inline. Evoluir para nonce/hash e remover 'unsafe-inline'.
  add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location /api/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location = /api {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /assets/ {
    try_files $uri @backend;
  }

  location /uploads/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /relatorios/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /certificados-calibracao/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location = /health {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location @backend {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }
}
