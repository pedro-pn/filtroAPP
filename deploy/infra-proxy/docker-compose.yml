name: infra-proxy

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: infra-proxy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 e QUIC, sobre UDP. Sem esta linha o Caddy anuncia h3 no Alt-Svc
      # mas o listener fica inalcancavel: o navegador tenta, falha e cai para h2.
      - "443:443/udp"
    # Ponte para o daemon rootless (app do outro setor), que nao pode
    # participar de redes deste daemon.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - infra_proxy_data:/data
      - infra_proxy_config:/config
    networks:
      - proxy-net

volumes:
  infra_proxy_data:
    name: infra_proxy_data
  infra_proxy_config:
    name: infra_proxy_config

networks:
  proxy-net:
    name: proxy-net
    external: true
