  # Unitários/lint/build e navegador rodam em paralelo; o job "Frontend" abaixo
  # consolida o resultado, para o nome exigido na proteção da main continuar o mesmo.
  frontend-unit:
    name: Frontend unit, lint and build
    # Keep browser dependencies on the same fixed Ubuntu release.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # node_modules inteiro em cache pelo lockfile: com cache, o `npm ci` (~1 min) é pulado.
      - name: Restore frontend node_modules
        id: nodemodules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: frontend-node-modules-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.nodemodules.outputs.cache-hit != 'true'
        run: npm ci


      - name: Generate audit report
        run: |
          mkdir -p ../audit-reports
          npm run audit:ci -- --report ../audit-reports/frontend-audit.json

      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-audit
          path: audit-reports/frontend-audit.json
          if-no-files-found: warn

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      # O job "E2E (real stack)" testa exatamente este bundle (spec 040, D3).
      - name: Upload production bundle for the real e2e job
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

      - name: Check page loading budgets
        run: npm run performance:check

  frontend-browser:
    name: Frontend browser (${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # rdo: suíte de formulários/notificações do RDO (a mais longa);
        # others: EPI, carregamento de páginas, Efetivo e CONECTA RH.
        group: [rdo, others]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # node_modules inteiro em cache pelo lockfile: com cache, o `npm ci` (~1 min) é pulado.
      - name: Restore frontend node_modules
        id: nodemodules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: frontend-node-modules-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.nodemodules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare DNS for Ubuntu packages
        run: |
          if ! timeout 5 getent ahostsv4 mirrors.edge.kernel.org > /dev/null; then
            bash ../scripts/ensure-ubuntu-package-dns.sh
          fi

      # Os espelhos padrão do runner (Azure) ficam como estão: priorizar
      # mirrors.edge.kernel.org travou o `apt-get update` por 15 min em 2026-11-19
      # (InRelease respondia ao curl, mas os índices ficavam em "Ign").
      - name: Configure Ubuntu package mirrors
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/zz-ci-retries > /dev/null

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # O espelho do apt da Ubuntu às vezes trava (pacotes ou o próprio índice).
      # O navegador e os .deb das dependências ficam em cache por versão do
      # Playwright; com cache, nada é baixado do espelho.
      - name: Restore Playwright Chromium and its Ubuntu packages
        id: pwcache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-archives
          key: playwright-chromium-ubuntu-24.04-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for notification and equipment regressions
        timeout-minutes: 15
        run: |
          # O navegador vem do cache. O runner já traz as bibliotecas do Chrome;
          # só instala dependências do sistema se o Chromium não abrir.
          npx playwright install chromium
          probe() {
            node -e "require('@playwright/test').chromium.launch().then(b => b.close()).catch(e => { console.error(e.message); process.exit(1); })"
          }
          if probe; then exit 0; fi
          echo "Chromium não abriu sem dependências; tentando os .deb do cache."
          if ls ~/apt-archives/*.deb > /dev/null 2>&1 \
            && sudo apt-get install -y --no-download --no-install-recommends ~/apt-archives/*.deb && probe; then
            exit 0
          fi
          echo "Instalando dependências pela rede."
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s/apt-archives/";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/zz-ci-archive-cache > /dev/null
          npx playwright install --with-deps chromium
          # O apt grava como root; o cache só salva o que o runner consegue ler.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Verify EPI catalog sizes and required delivery selection in the browser
        if: matrix.group == 'others'
        run: npx playwright test --config=playwright.quality-epi.config.ts --project=chromium epi-sizes.spec.ts

      - name: Verify RDO forms, notifications and equipment selection in the browser
        if: matrix.group == 'rdo'
        run: >-
          npx playwright test --config=playwright.rdo.config.ts
          rdo-notifications-equipment.behavior.spec.ts rdo-project-context.behavior.spec.ts
          rdo-service-only-permission.behavior.spec.ts

      - name: Verify page loading, useful content and cross-context updates
        if: matrix.group == 'others'
        run: npm run test:performance

      - name: Verify Efetivo project closeout and satisfaction surveys in the browser
        if: matrix.group == 'others'
        run: npx playwright test --config=playwright.efetivo.config.ts

      - name: Verify CONECTA RH pre-admission confirmation in the browser
        if: matrix.group == 'others'
        run: npx playwright test --config=playwright.conecta.config.ts

      - name: Upload page performance browser regression report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: page-performance-browser-report
          path: output/playwright/performance
          if-no-files-found: warn

      - name: Upload Efetivo browser regression report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: efetivo-closeout-browser-report
          path: output/playwright/efetivo
          if-no-files-found: warn

      - name: Upload CONECTA RH browser regression report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conecta-rh-browser-report
          path: output/playwright/conecta
          if-no-files-found: warn

      - name: Upload EPI browser regression report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: epi-sizes-browser-report
          path: output/playwright/quality-epi
          if-no-files-found: warn

      - name: Upload browser regression report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: notifications-equipment-browser-report
          path: output/playwright/rdo-a1
          if-no-files-found: warn

  frontend:
    name: Frontend
    if: always()
    needs: [frontend-unit, frontend-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Frontend job to succeed
        run: |
          echo "frontend-unit: ${{ needs.frontend-unit.result }} / frontend-browser: ${{ needs.frontend-browser.result }}"
          test "${{ needs.frontend-unit.result }}" = success
          test "${{ needs.frontend-browser.result }}" = success

  e2e-real:
    name: E2E (real stack)
    # Spec 040: navegador → bundle de produção → backend real → PostgreSQL real,
    # com o código do 2FA capturado pelo Mailpit. Informativo até 10 execuções
    # seguidas sem falha (decisão D1); não entra nos agregadores Frontend/Backend.
    needs: frontend-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filtrovali_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filtrovali_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.0
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali_e2e
      E2E_MAILPIT_URL: http://127.0.0.1:8025
      E2E_SMTP_PORT: "1025"
      E2E_SEED_OUTPUT: ${{ github.workspace }}/output/e2e-real/seed.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore frontend node_modules
        id: nodemodules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: frontend-node-modules-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.nodemodules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      # O backend roda da imagem de produção (backend/Dockerfile): mesmo Node,
      # LibreOffice (PDF do RDO) e dependências que vão ao ar. Cache de camadas
      # do GitHub Actions: o apt/pip/npm da imagem só roda quando mudam.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: filtrovali-backend:e2e
          build-args: APP_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-e2e
          cache-to: type=gha,mode=max,scope=backend-e2e

      - name: Apply migrations and seed the disposable database
        run: |
          mkdir -p output/e2e-real
          docker run --rm --network host \
            -e NODE_ENV=test -e TRUST_PROXY=false \
            -e DATABASE_URL="$E2E_DATABASE_URL" \
            -e E2E_SEED_OUTPUT=/out/seed.json \
            -v "$PWD/output/e2e-real:/out" \
            filtrovali-backend:e2e \
            sh -c "npx prisma migrate deploy && node prisma/e2e-seed.js"

      - name: Start the backend
        run: |
          mkdir -p output/e2e-real/storage
          docker run -d --name e2e-backend --network host \
            -e NODE_ENV=test -e TZ=America/Sao_Paulo -e PORT=4100 \
            -e DATABASE_URL="$E2E_DATABASE_URL" -e TRUST_PROXY=false \
            -e BACKGROUND_JOBS_IN_API=false -e TWO_FACTOR_ENFORCEMENT=on -e SEND_CLIENT_EMAILS=true \
            -e SMTP_HOST=127.0.0.1 -e SMTP_PORT="$E2E_SMTP_PORT" -e SMTP_SECURE=false \
            -e SMTP_AUTH_MODE=password -e SMTP_USER=e2e -e SMTP_PASS=e2e \
            -e SMTP_FROM="Filtrovali E2E <no-reply@e2e.test>" -e APP_URL=http://127.0.0.1:4194 \
            -e REPORTS_DIR=/data/relatorios -v "$PWD/output/e2e-real/storage:/data/relatorios" \
            -e SIGNATURE_TOKEN_SECRET=e2e-signature-token-secret -e SURVEY_TOKEN_SECRET=e2e-survey-token-secret \
            filtrovali-backend:e2e node src/server.js
          for _ in $(seq 1 60); do
            curl --fail --silent --max-time 2 http://127.0.0.1:4100/health && exit 0
            sleep 1
          done
          docker logs e2e-backend >&2
          exit 1

      - name: Download production bundle
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Wait for Mailpit
        run: |
          for _ in $(seq 1 30); do
            curl --fail --silent --max-time 2 "$E2E_MAILPIT_URL/api/v1/info" > /dev/null && exit 0
            sleep 1
          done
          echo "Mailpit não respondeu em 30 s" >&2
          exit 1

      - name: Resolve Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-archives
          key: playwright-chromium-ubuntu-24.04-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        timeout-minutes: 15
        working-directory: frontend
        run: |
          # Mesmo esquema do frontend-browser: navegador do cache e, só se ele
          # não abrir, dependências do sistema (cache de .deb e depois a rede).
          npx playwright install chromium
          probe() {
            node -e "require('@playwright/test').chromium.launch().then(b => b.close()).catch(e => { console.error(e.message); process.exit(1); })"
          }
          if probe; then exit 0; fi
          if ls ~/apt-archives/*.deb > /dev/null 2>&1 \
            && sudo apt-get install -y --no-download --no-install-recommends ~/apt-archives/*.deb && probe; then
            exit 0
          fi
          npx playwright install --with-deps chromium

      - name: Run real end-to-end journeys
        working-directory: frontend
        env:
          E2E_BACKEND_EXTERNAL: "1"
        run: npm run test:e2e:real

      - name: Collect backend log and captured e-mails
        if: failure()
        run: |
          mkdir -p output/e2e-real
          docker logs e2e-backend > output/e2e-real/backend.log 2>&1 || true
          curl --silent --max-time 5 "$E2E_MAILPIT_URL/api/v1/messages?limit=50" > output/e2e-real/mailpit-messages.json || true

      - name: Upload real e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-real-report
          path: output/e2e-real
          if-no-files-found: warn

  docker:
    name: Docker
    runs-on: ubuntu-latest
    env:
      STAGING_POSTGRES_PASSWORD: ci-staging-postgres-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build env files
        run: touch backend/.env.staging backend/.env.production

      - name: Validate production and staging compose files
        run: |
          POSTGRES_PASSWORD=ci docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.staging.yml config --quiet

      - name: Verify staging HTTPS proxy and IP restrictions
        run: python3 deploy/test-staging-https.py

      - name: Verify Nginx health in an isolated local container
        run: python3 deploy/test-nginx-health.py

      - name: Verify the runtime maintenance page in isolated containers
        run: python3 deploy/test-nginx-maintenance.py

      - name: Build staging images
        run: docker compose -f docker-compose.staging.yml build backend nginx

  database-role:
    name: Database least-privilege role (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filtroapp_role_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filtroapp_role_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      # Migrations: dono das tabelas. Runtime e testes: papel restrito, como em produção.
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_role_test?schema=public
      DATABASE_URL: postgresql://filtrovali_app:ci_app_role_password_0000000000@localhost:5432/filtroapp_role_test?schema=public
      APP_URL: postgresql://filtrovali_app:ci_app_role_password_0000000000@localhost:5432/filtroapp_role_test?schema=public
      OWNER_PSQL: postgresql://postgres:postgres@localhost:5432/filtroapp_role_test
      APP_PSQL: postgresql://filtrovali_app:ci_app_role_password_0000000000@localhost:5432/filtroapp_role_test
      TRUST_PROXY: "false"
      SIGNATURE_TOKEN_SECRET: ci-signature-token-secret
      SURVEY_TOKEN_SECRET: ci-survey-token-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate

      - name: Apply migrations as the table owner
        run: npm run prisma:deploy

      - name: Create the restricted application role
        run: >-
          psql "$OWNER_PSQL" -X -v ON_ERROR_STOP=1
          -v app_role=filtrovali_app -v app_password=ci_app_role_password_0000000000
          -f ../deploy/db/app-role.sql

      - name: Re-apply the role script (idempotency)
        run: psql "$OWNER_PSQL" -X -q -v ON_ERROR_STOP=1 -v app_role=filtrovali_app -f ../deploy/db/app-role.sql

      - name: Restricted role has every DML grant and no owner privilege
        # Como no Compose: o ambiente da aplicação não recebe a credencial do dono.
        env:
          MIGRATION_DATABASE_URL: ""
        run: node scripts/check-database-role.js --require-restricted

      - name: Role check rejects an owner credential visible to the app
        run: |
          if node scripts/check-database-role.js --require-restricted > /dev/null 2>&1; then
            echo "check-database-role.js deveria reprovar com MIGRATION_DATABASE_URL no ambiente" >&2
            exit 1
          fi

      - name: Restricted role cannot change the schema or migration history
        run: |
          expect_denied() {
            if psql "$APP_PSQL" -X -q -v ON_ERROR_STOP=1 -c "$1" > /dev/null 2>&1; then
              echo "::error::o papel restrito executou: $1"; exit 1
            fi
            echo "negado como esperado: $1"
          }
          expect_denied 'CREATE TABLE "ZzCiForbidden" (id int)'
          expect_denied 'CREATE SCHEMA zz_ci_forbidden'
          expect_denied 'TRUNCATE "User"'
          expect_denied 'ALTER TABLE "User" ADD COLUMN "zzCi" int'
          expect_denied 'DROP TABLE "User"'
          expect_denied 'DELETE FROM "_prisma_migrations"'
          expect_denied 'CREATE EXTENSION IF NOT EXISTS pgcrypto'

      - name: Future migrations stay covered by default privileges
        run: |
          psql "$OWNER_PSQL" -X -q -v ON_ERROR_STOP=1 -c 'CREATE TABLE "ZzCiFutureTable" (id serial PRIMARY KEY, label text)'
          psql "$APP_PSQL" -X -q -v ON_ERROR_STOP=1 \
            -c "INSERT INTO \"ZzCiFutureTable\" (label) VALUES ('ok')" \
            -c 'UPDATE "ZzCiFutureTable" SET label = label' \
            -c 'DELETE FROM "ZzCiFutureTable"'
          MIGRATION_DATABASE_URL= node scripts/check-database-role.js --require-restricted
          psql "$OWNER_PSQL" -X -q -v ON_ERROR_STOP=1 -c 'DROP TABLE "ZzCiFutureTable"'

      - name: Integration suites (advisory locks, statistics, costs) run as the restricted role
        env:
          DRAFTS_TEST_DATABASE_URL: ${{ env.APP_URL }}
          STATISTICS_TEST_DATABASE_URL: ${{ env.APP_URL }}
          ADDITIONAL_METRICS_TEST_DATABASE_URL: ${{ env.APP_URL }}
          CHEMICAL_COST_TEST_DATABASE_URL: ${{ env.APP_URL }}
          PROPOSAL_PERCENTAGE_TEST_DATABASE_URL: ${{ env.APP_URL }}
        run: >-
          node --test --test-concurrency=1
          test/drafts-concurrency.test.js
          test/statistics-corrections.test.js
          test/acompanhamento-additional-metrics.integration.test.js
          test/acompanhamento-chemical-cost.integration.test.js
          test/acompanhamento-proposal-percentage.integration.test.js

      # Estas suítes exigem bancos com nome próprio (proteção contra rodar no banco errado).
      - name: Prepare dedicated databases (owner migrates, restricted role runs)
        run: |
          for db in filtroapp_notifications_test filtroapp_equipment_test conecta_allocation_test; do
            psql "$OWNER_PSQL" -X -q -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
            MIGRATION_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$db?schema=public" npm run prisma:deploy
            psql "postgresql://postgres:postgres@localhost:5432/$db" -X -q -v ON_ERROR_STOP=1 \
              -v app_role=filtrovali_app -f ../deploy/db/app-role.sql
          done

      - name: Notification triggers and outbox run as the restricted role
        env:
          DATABASE_URL: postgresql://filtrovali_app:ci_app_role_password_0000000000@localhost:5432/filtroapp_notifications_test
          TEST_NOTIFICATION_DATABASE_URL: postgresql://filtrovali_app:ci_app_role_password_0000000000@localhost:5432/filtroapp_notifications_test
        run: node --test test/notification-center.integration.test.js

      - name: RDO equipment suites run as the restricted role
        env:
          DATABASE_URL: postgresql://filtrovali_app:ci_app_role_password_0000000000@localhost:5432/filtroapp_equipment_test
          TEST_RDO_EQUIPMENT_DATABASE_URL: postgresql://filtrovali_app:ci_app_role_password_0000000000@localhost:5432/filtroapp_equipment_test
        run: node --test --test-concurrency=1 test/rdo-equipment-slots.integration.test.js test/equipment-operation-manual.integration.test.js

      - name: Conecta allocation suite runs as the restricted role
        env:
          DATABASE_URL: postgresql://filtrovali_app:ci_app_role_password_0000000000@localhost:5432/conecta_allocation_test
          TEST_CONECTA_DATABASE_URL: postgresql://filtrovali_app:ci_app_role_password_0000000000@localhost:5432/conecta_allocation_test
        run: node --test test/integration-allocation-review.test.js

      # A cópia de produção da homologação é anonimizada antes de ficar visível
      # (deploy/sync-staging.sh). Aqui o SQL roda num banco migrado com dados
      # fictícios: precisa mascarar tudo e falhar ao achar coluna pessoal sem regra.
      - name: Staging anonymization masks personal data and fails closed
        run: |
          psql "$OWNER_PSQL" -X -q -v ON_ERROR_STOP=1 -c "CREATE DATABASE staging_anon_test"
          MIGRATION_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/staging_anon_test?schema=public" npm run prisma:deploy
          ../deploy/db/test-anonymize-staging.sh "postgresql://postgres:postgres@localhost:5432/staging_anon_test"
