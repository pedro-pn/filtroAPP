name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run architecture check
        run: npm run architecture:check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filtrovali
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filtrovali"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      PROPOSAL_PERCENTAGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      ADDITIONAL_METRICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      CHEMICAL_COST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      DATABOOK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      PROPOSAL_SCOPE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      DRAFTS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      TRUST_PROXY: "false"
      SIGNATURE_TOKEN_SECRET: ci-signature-token-secret
      SURVEY_TOKEN_SECRET: ci-survey-token-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate audit report
        run: |
          mkdir -p ../audit-reports
          npm audit --audit-level=high --json > ../audit-reports/backend-audit.json

      - name: Upload backend audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-audit
          path: audit-reports/backend-audit.json
          if-no-files-found: warn

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Setup Python (gerador do Data Book)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/databook/requirements.txt

      - name: Install Data Book generator dependencies
        run: pip install -r databook/requirements.txt jsonschema

      - name: Install Hunspell pt-BR (revisão ortográfica do Data Book)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends hunspell hunspell-pt-br

      - name: Run Data Book generator tests
        working-directory: backend/databook
        run: python -m unittest discover -s tests -v

      - name: Run backend tests
        env:
          DATABOOK_PYTHON: python
        run: npm test

  commercial-contributions:
    name: Commercial contributions (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filtroapp_bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filtroapp_bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      PLANNED_HOURS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      ADDITIONAL_METRICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      TRUST_PROXY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - name: Verify contributions, migration, mixed sources and v1 regression
        run: >-
          node --test test/commercial-additional-contributions.integration.test.js
          test/commercial-additional-migration.integration.test.js
          test/proposal-scope-databook.integration.test.js
          test/comercialapp-bridge.integration.test.js test/commercial-proposal-sync.test.js
          test/commercialapp-scope.test.js test/acompanhamento-planned-hours.test.js
          test/acompanhamento-planned-hours.integration.test.js
          test/acompanhamento-additional-metrics.integration.test.js

  prisma-planning:
    name: PrismaCRM planning (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filtroapp_crm_planning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filtroapp_crm_planning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_crm_planning_test
      CRM_OPPORTUNITIES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_crm_planning_test
      API_TOKEN_HASH_KEY_V1: ci-prisma-planning-hash-key-over-32-characters
      TRUST_PROXY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - name: Verify planning contract, lifecycle, links and idempotency
        run: node --test test/crm-opportunities.test.js test/crm-opportunities.integration.test.js

  notifications:
    name: Notifications (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filtroapp_notifications_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filtroapp_notifications_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_notifications_test
      TEST_NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_notifications_test
      TRUST_PROXY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - name: Verify notification events, permissions, read state and API
        run: node --test test/notification-center-migration.test.js test/notification-center.integration.test.js

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate audit report
        run: |
          mkdir -p ../audit-reports
          npm audit --audit-level=high --json > ../audit-reports/frontend-audit.json

      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-audit
          path: audit-reports/frontend-audit.json
          if-no-files-found: warn

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    env:
      STAGING_POSTGRES_PASSWORD: ci-staging-postgres-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build env files
        run: touch backend/.env.staging

      - name: Build staging images
        run: docker compose -f docker-compose.staging.yml build backend nginx
