name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run architecture check
        run: npm run architecture:check

  # Os testes do backend rodam em 3 fatias paralelas (cada uma com seu
  # PostgreSQL); o job "Backend" abaixo só consolida o resultado, para o nome
  # exigido na proteção da main continuar o mesmo.
  backend-tests:
    name: Backend tests (${{ matrix.shard }}/3)
    # Keep native package installation on a fixed runner image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filtrovali
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filtrovali"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      OMIE_SYNC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali
      PROPOSAL_PERCENTAGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      ADDITIONAL_METRICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      CHEMICAL_COST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      DATABOOK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      PROPOSAL_SCOPE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      DRAFTS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      STATISTICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali?schema=public
      # Suítes que exigem um banco cujo nome termina em _test (criado no passo abaixo).
      # O teste ci-db-suite-coverage falha se uma suíte com guarda de ambiente não rodar em nenhum job.
      SUITES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali_suites_test?schema=public
      RDO_SIMULATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali_suites_test?schema=public
      HISTORICAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali_suites_test?schema=public
      PROJECT_DELETION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali_suites_test?schema=public
      SYSTEMS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali_suites_test?schema=public
      LGPD_RETENTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali_suites_test?schema=public
      USAGE_COUNTERS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtrovali_suites_test?schema=public
      EFETIVO_DB_TESTS: "1"
      TRUST_PROXY: "false"
      SIGNATURE_TOKEN_SECRET: ci-signature-token-secret
      SURVEY_TOKEN_SECRET: ci-survey-token-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate audit report
        if: matrix.shard == 1
        run: |
          mkdir -p ../audit-reports
          npm audit --audit-level=high --json > ../audit-reports/backend-audit.json

      - name: Upload backend audit report
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: backend-audit
          path: audit-reports/backend-audit.json
          if-no-files-found: warn

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Create and migrate isolated suites database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d filtrovali -v ON_ERROR_STOP=1 -c 'CREATE DATABASE filtrovali_suites_test'
          DATABASE_URL="$SUITES_TEST_DATABASE_URL" npm run prisma:deploy

      - name: Setup Python (gerador do Data Book)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/databook/requirements.txt

      - name: Install Data Book generator dependencies
        run: pip install -r databook/requirements.txt jsonschema

      - name: Prepare DNS for Ubuntu packages
        run: |
          if ! timeout 5 getent ahostsv4 mirrors.edge.kernel.org > /dev/null; then
            bash ../scripts/ensure-ubuntu-package-dns.sh
          fi

      # Os espelhos padrão do runner (Azure) ficam como estão: priorizar
      # mirrors.edge.kernel.org travou o `apt-get update` por 15 min em 2026-11-19
      # (InRelease respondia ao curl, mas os índices ficavam em "Ign").
      - name: Configure Ubuntu package mirrors
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/zz-ci-retries > /dev/null

      # Mesmo cuidado do Chromium no job Frontend: os .deb ficam em cache e, com
      # cache, a instalação não toca o espelho do apt.
      - name: Restore Hunspell Ubuntu packages
        id: hunspellcache
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: hunspell-pt-br-ubuntu-24.04-v1

      - name: Install Hunspell pt-BR (revisão ortográfica do Data Book)
        timeout-minutes: 15
        run: |
          # Com cache: dpkg instala os .deb guardados direto, sem índice nem rede.
          # Se faltar dependência, o apt pela rede abaixo completa a instalação.
          if [ "${{ steps.hunspellcache.outputs.cache-hit }}" = "true" ] && ls ~/apt-archives/*.deb > /dev/null 2>&1 \
            && sudo dpkg -i ~/apt-archives/*.deb && hunspell -D < /dev/null 2>&1 | grep -q pt_BR; then
            exit 0
          fi
          echo "Cache de pacotes indisponível ou incompatível: instalando pela rede."
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s/apt-archives/";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/zz-ci-archive-cache > /dev/null
          sudo apt-get update && sudo apt-get install -y --no-install-recommends hunspell hunspell-pt-br
          # O apt grava como root; o cache só salva o que o runner consegue ler.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Run Data Book generator tests
        if: matrix.shard == 1
        working-directory: backend/databook
        run: python -m unittest discover -s tests -v

      - name: Run backend tests (shard)
        env:
          DATABOOK_PYTHON: python
        run: node scripts/run-test-shard.js --shard=${{ matrix.shard }} --of=3

  backend:
    name: Backend
    if: always()
    needs: [backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend test shard to succeed
        run: |
          echo "backend-tests: ${{ needs.backend-tests.result }}"
          test "${{ needs.backend-tests.result }}" = success

  commercial-contributions:
    name: Commercial contributions (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filtroapp_bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filtroapp_bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      PLANNED_HOURS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      MECHANICAL_SCOPE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      COMMERCIAL_RECEIPT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      ADDITIONAL_METRICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filtroapp_bridge_test
      TRUST_PROXY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - name: Verify contributions, migration, mixed sources and v1 regression
        run: >-
          node --test --test-concurrency=1 test/commercial-additional-contributions.integration.test.js
          test/commercial-additional-migration.integration.test.js
          test/commercial-proposal-backfill.integration.test.js
          test/proposal-scope-databook.integration.test.js
          test/comercialapp-bridge.integration.test.js test/commercial-proposal-sync.test.js
          test/commercialapp-scope.test.js test/acompanhamento-planned-hours.test.js
          test/acompanhamento-planned-hours.integration.test.js
          test/acompanhamento-additional-metrics.integration.test.js
          test/mechanical-scope-rental.integration.test.js
          test/commercialapp-receipts.integration.test.js

