      - name: Verify point projections, shared catalogs and card consumers
        env:
          ACOMPANHAMENTO_READ_CACHE_ENABLED: "true"
          API_TOKEN_HASH_KEY_V1: ci-prisma-planning-hash-key-over-32-characters
          PRESENTATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/http_performance_test
          CRM_OPPORTUNITIES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/http_performance_test
        run: >-
          node --test --test-concurrency=1 test/ponto-detail-performance.integration.test.js
          test/verified-cost-sources.integration.test.js test/project-presentation-copy.integration.test.js
          test/acompanhamento-operational-sources.integration.test.js
          test/acompanhamento-source-batches.integration.test.js
          test/cache-layer-controls.integration.test.js
          test/monthly-snapshot-admission.integration.test.js
          test/verified-progress-sources.integration.test.js
          test/job-run-volume.integration.test.js
          test/crm-opportunities.integration.test.js

