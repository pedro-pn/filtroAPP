        snapshotAt é limite de leitura de registros atuais, sem isolamento histórico entre páginas.
        Após a varredura, repetir desde reconcileFrom para capturar alterações concorrentes.
        Preservar updatedSince em todas as páginas e atualizar por externalId/updatedAt. Vínculos podem mudar sem nova sourceVersion.
      security: [{ IntegrationToken: [] }]
