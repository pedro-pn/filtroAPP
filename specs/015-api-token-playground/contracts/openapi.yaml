  /integracoes/v1/acompanhamento/oportunidades:
    post:
      tags: [IntegrationOperational]
      operationId: postIntegrationCrmOpportunity
      summary: Recebe retrato planning-1.0 e resolve o projeto sem duplicar a oportunidade
      description: >-
        Exige ALL e Idempotency-Key igual ao eventId. Retrato completo; desconhecidos são null explícito.
        OPEN sinalizada aparece em Futuros; POSTPONED sinalizada aparece em Pausadas. WON incompleto
        é aceito com PENDING_DATA, em Futuros. Retirada exige motivo e preserva projeto confirmado.
        EventId e versão são imutáveis: repetição divergente retorna 409 mesmo se antiga.
        Cada organização/ambiente é fixado pelo servidor. Os identificadores de oportunidade,
        missão e projeto são distintos; várias oportunidades podem compartilhar um projeto.
      security: [{ IntegrationToken: [] }]
      x-required-scopes: [acompanhamento.oportunidades.write, efetivo.projetos.create]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Mesmo UUID do eventId; retentativas preservam UUID e conteúdo.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PreferValidateOnly"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrmOpportunityInput' }
      responses:
        '201':
          description: Primeira versão aplicada e persistida atomicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmOpportunityResult' }
        '200':
          description: "Simulação validada; nenhuma escrita de domínio persistida. LIVE conserva sua resposta anterior."
          content:
            application/json:
              schema: {"oneOf":[{"$ref":"#/components/schemas/CrmOpportunityResult"},{"$ref":"#/components/schemas/SimulatedWriteResult"}]}
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        '400': {"$ref":"#/components/responses/SimulatedValidationError"}
        '401': {"$ref":"#/components/responses/SimulatedInvalidIntegrationToken"}
        '403': {"$ref":"#/components/responses/SimulatedForbidden"}
        '409': {"$ref":"#/components/responses/SimulatedConflict"}
        '422':
          description: Retrato incompleto ou regra de negócio inválida; corrigir em nova versão/evento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        '429': {"$ref":"#/components/responses/SimulatedRateLimited"}
        "501":
          $ref: "#/components/responses/SimulationNotSupported"

