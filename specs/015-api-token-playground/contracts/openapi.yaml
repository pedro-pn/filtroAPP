        nextCursor: { type: [string, 'null'] }
        limit: { type: integer, minimum: 1 }
        hasMore: { type: boolean }
    IntegrationPageMeta:
      type: object
      additionalProperties: false
      required: [nextCursor, limit, hasMore, snapshotAt]
      properties:
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer, minimum: 1 }
        hasMore: { type: boolean }
        snapshotAt:
          type: string
          format: date-time
          description: Teto fixado na primeira página e preservado pelo cursor.
    ProjectRef:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    NatureRef:
      type: object
      additionalProperties: false
      required: [id, name, isActive]
      properties:
        id: { type: string }
        name: { type: string }
        isActive: { type: boolean }
    QualityEvidence:
      type: object
      additionalProperties: false
      required: [id, kind, label, fileName, mimeType, position, createdAt, downloadAvailable]
      properties:
        id: { type: string }
        kind: { type: string }
        label: { type: [string, 'null'] }
        fileName: { type: [string, 'null'] }
        mimeType: { type: [string, 'null'] }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
        downloadAvailable: { type: boolean }
    QualityRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - type
        - registeredAt
        - origin
        - project
        - eventDate
        - nature
        - description
        - impact
        - recurrence
        - linkedRnc
        - disposition
        - definedAction
        - actionOwner
        - actionDeadline
        - evidenceSummary
        - resultVerification
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        number: { type: string }
        type: { type: string }
        registeredAt: { type: string, format: date-time }
        origin: { type: [string, 'null'] }
        project:
          anyOf:
            - $ref: '#/components/schemas/ProjectRef'
            - type: 'null'
        eventDate: { type: string, format: date }
        nature:
          anyOf:
            - $ref: '#/components/schemas/NatureRef'
            - type: 'null'
        subnature:
          anyOf:
            - type: object
              additionalProperties: false
              required: [id, name, natureId]
              properties:
                id: { type: string }
                name: { type: string }
                natureId: { type: string }
            - type: 'null'
        description: { type: [string, 'null'] }
        impact: { type: [string, 'null'] }
        recurrence:
          type: object
          additionalProperties: false
          required: [occurrences12m, recurrent]
          properties:
            occurrences12m: { type: integer, minimum: 0 }
            recurrent: { type: boolean }
        linkedRnc: { type: [string, 'null'] }
        disposition: { type: [string, 'null'] }
        definedAction: { type: [string, 'null'] }
        actionOwner: { type: [string, 'null'] }
        actionDeadline: { type: [string, 'null'], format: date }
        evidenceSummary: { type: [string, 'null'] }
        resultVerification: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        evidences:
          type: array
          description: Omitido sem `qualidade.evidencias.metadata.read`.
          items: { $ref: '#/components/schemas/QualityEvidence' }
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: Omitido sem `qualidade.excluidos.read`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QualityRecordPage:
      type: object
      additionalProperties: false
      required: [items, page, generatedAt, schemaVersion, requestId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QualityRecord' }
        page: { $ref: '#/components/schemas/IntegrationPageMeta' }
        generatedAt: { type: string, format: date-time }
        schemaVersion: { type: string, const: '1.0' }
        requestId: { type: string }
    QualityNature:
      type: object
      additionalProperties: false
      required: [id, name, isActive, position, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        isActive: { type: boolean }
        position: { type: integer }
        subnatures:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, position]
            properties:
              id: { type: string }
              name: { type: string }
              position: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QualityNaturePage:
      type: object
      additionalProperties: false
      required: [items, page, generatedAt, schemaVersion, requestId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QualityNature' }
        page: { $ref: '#/components/schemas/IntegrationPageMeta' }
        generatedAt: { type: string, format: date-time }
        schemaVersion: { type: string, const: '1.0' }
        requestId: { type: string }
    SimulatedWriteResult:
      type: object
      additionalProperties: false
      required:
        - simulated
        - operation
        - would
        - warnings
        - requestId
      properties:
        simulated:
          type: boolean
          const: true
        operation:
          type: string
        would:
          type: object
          additionalProperties: true
          description: Projeção dos campos calculados no banco, sem IDs temporários ou numeração definitiva. Qualidade retorna type, status, origin, description, impact, externalRef, actionOwnerUserId, projectCode, eventDate e previewNumber. Replays refletem os dados existentes.
        warnings:
          type: array
          items:
            type: string
        requestId:
          type: string
    UpdateCredentialWriteModeInput:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - reason
        - writeMode
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 10
          maxLength: 500
        writeMode:
          type: string
          enum:
            - LIVE
            - SIMULATE
          default: LIVE
          description: SIMULATE sempre executa escritas com rollback, mesmo sem Prefer.
