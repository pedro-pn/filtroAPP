components:
  securitySchemes:
    AdminSession:
      type: http
      scheme: bearer
      bearerFormat: FiltroApp human session
      description: Sessão existente de usuário; o servidor também exige `accountType=ADMIN`.
    IntegrationToken:
      type: http
      scheme: bearer
      bearerFormat: fva_selector_secret
      description: Credencial opaca externa, aceita somente sob `/integracoes/v1`.

  headers:
    NoStore:
      description: Resposta não deve ser armazenada
      schema: { type: string, const: no-store }
    NoCache:
      description: Compatibilidade adicional na revelação do segredo
      schema: { type: string, const: no-cache }
    RequestId:
      description: Identificador de correlação seguro
      schema: { type: string }

  parameters:
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID por tentativa lógica; repetição nunca emite um segundo segredo.
      schema: { type: string, format: uuid }
    AdminCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 1000 }
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IntegrationCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2000 }
      description: Cursor opaco vinculado à operação, versão e filtros.
    IntegrationLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      description: Também limitado pelo `maxPageSize` da credencial.
    IntegrationReportType:
      name: reportType
      in: query
      style: form
      explode: false
      description: "Um ou mais tipos de relatório separados por vírgula. Exemplo para RCPUs: reportType=RCPU."
      schema:
        type: array
        items:
          type: string
          enum: [RDO, RDO_MAINTENANCE, RDO_PRODUCTION, RTP, RLQ, RCPU, RLM, RLF, RLI]

  responses:
    AdminUnauthorized:
      description: Sessão humana ausente ou inválida
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminForbidden:
      description: Conta autenticada não é ADMIN
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidIntegrationToken:
      description: Token ausente, malformado, desconhecido, agendado, expirado ou revogado
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  code: { const: INVALID_TOKEN }
    Forbidden:
      description: Escopo, projeto, IP ou recurso não permitido
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Parâmetro ou corpo inválido
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    NotFound:
      description: Recurso inexistente ou invisível para a credencial
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Versão concorrente, idempotência repetida ou transição inválida
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Limite de requisições, linhas ou volume excedido
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  code: { const: RATE_LIMITED }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        error: { type: string, description: Alias de message incluído nos erros administrativos para compatibilidade. }
        fields:
          type: array
          description: Campos inválidos, quando aplicável.
          items:
            type: object
            additionalProperties: false
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    ValidationError:
      type: object
      additionalProperties: false
      required: [code, message, requestId, fields]
      properties:
        code: { const: VALIDATION_ERROR }
        message: { type: string }
        requestId: { type: string }
        error: { type: string, description: Alias de message incluído nos erros administrativos para compatibilidade. }
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }

    CredentialEffectiveStatus:
      type: string
      enum: [SCHEDULED, ACTIVE, NEAR_EXPIRY, EXPIRED, REVOKED]
    ProjectAccess:
      type: object
      additionalProperties: false
      required: [mode, projectIds]
      properties:
        mode: { type: string, enum: [ALL, SELECTED] }
        projectIds:
          type: array
          uniqueItems: true
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 100 }
    CredentialLimits:
      type: object
      additionalProperties: false
      required: [requestsPerMinute, requestsPerDay, rowsPerDay, maxPageSize]
      properties:
        requestsPerMinute: { type: integer, minimum: 1, maximum: 600, default: 60 }
        requestsPerDay: { type: integer, minimum: 1, maximum: 100000, default: 10000 }
        rowsPerDay: { type: integer, minimum: 1, maximum: 10000000, default: 500000 }
        maxPageSize: { type: integer, minimum: 1, maximum: 500, default: 100 }
    CreateCredentialInput:
      type: object
      additionalProperties: false
      required:
        - name
        - purpose
        - recipientName
        - startsAt
        - expiresAt
        - scopeCodes
        - projectAccess
        - allowedIpCidrs
        - allowedFormats
        - limits
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        purpose: { type: string, minLength: 10, maxLength: 500 }
        recipientName: { type: string, minLength: 2, maxLength: 120 }
        recipientContact: { type: [string, 'null'], maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
        startsAt: { type: string, format: date-time }
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Nulo somente com confirmação exata de não expiração.
        neverExpiresConfirmation:
          type: string
          const: SEM EXPIRAÇÃO
        scopeCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 3, maxLength: 120 }
        projectAccess: { $ref: '#/components/schemas/ProjectAccess' }
        allowedIpCidrs:
          type: array
          uniqueItems: true
          maxItems: 100
          items: { type: string, minLength: 3, maxLength: 64 }
        allowedFormats:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [JSON] }
        limits: { $ref: '#/components/schemas/CredentialLimits' }
    ReduceCredentialInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
        name: { type: string, minLength: 3, maxLength: 100 }
        purpose: { type: string, minLength: 10, maxLength: 500 }
        recipientName: { type: string, minLength: 2, maxLength: 120 }
        recipientContact: { type: [string, 'null'], maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
        scopeCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 3, maxLength: 120 }
        projectAccess: { $ref: '#/components/schemas/ProjectAccess' }
        allowedIpCidrs:
          type: array
          uniqueItems: true
          maxItems: 100
          items: { type: string, minLength: 3, maxLength: 64 }
        limits: { $ref: '#/components/schemas/CredentialLimits' }
        expiresAt:
          type: string
          format: date-time
          description: Pode apenas antecipar a expiração vigente.
    RotateCredentialInput:
      type: object
      additionalProperties: false
      required: [replacement, reason, expectedVersion, revokePreviousAt]
      properties:
        replacement: { $ref: '#/components/schemas/CreateCredentialInput' }
        reason: { type: string, minLength: 10, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
        revokePreviousAt:
          type: string
          format: date-time
          description: Agora ou dentro da sobreposição máxima definida pelo servidor.
    ApiCredential:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - purpose
        - recipientName
        - displayToken
        - effectiveStatus
        - startsAt
        - expiresAt
        - scopeCodes
        - projectAccess
        - allowedIpCidrs
        - allowedFormats
        - limits
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        name: { type: string }
        purpose: { type: string }
        recipientName: { type: string }
        recipientContact: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        displayToken:
          type: string
          description: Prefixo e quatro últimos caracteres, nunca o segredo.
          example: fva_7k3m_••••a9Qx
        effectiveStatus: { $ref: '#/components/schemas/CredentialEffectiveStatus' }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        revocationReason: { type: [string, 'null'] }
        scopeCodes:
          type: array
          items: { type: string }
        projectAccess: { $ref: '#/components/schemas/ProjectAccess' }
        allowedIpCidrs:
          type: array
          items: { type: string }
        allowedFormats:
          type: array
          items: { type: string }
        limits: { $ref: '#/components/schemas/CredentialLimits' }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        rotatedFromId: { type: [string, 'null'] }
        replacementId: { type: [string, 'null'] }
        overlapEndsAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdBy:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IssuedCredential:
      type: object
      additionalProperties: false
      required: [credential, token, tokenShownOnce]
      properties:
        credential: { $ref: '#/components/schemas/ApiCredential' }
        token:
          type: string
          minLength: 40
          writeOnly: true
          description: Presente somente nesta resposta e mantido apenas em memória pelo cliente.
        tokenShownOnce: { type: boolean, const: true }
    CredentialPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiCredential' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ScopeDefinition:
      type: object
      additionalProperties: false
      required: [code, label, domain, description, sensitivity, availability, requiredScopes, operations, models, exposedFields, excludedFields, endpointFamilies]
      properties:
        code: { type: string }
        label: { type: string }
        domain: { type: string }
        description: { type: string }
        sensitivity: { type: string, enum: [NORMAL, PERSONAL, FINANCIAL, SIGNATURE, LGPD, INTERNAL] }
        availability: { type: string, enum: [AVAILABLE, PLANNED, SENSITIVE, RESERVED, PROHIBITED] }
        requiredScopes:
          type: array
          items: { type: string }
        operations:
          type: array
          items: { type: string }
        models:
          type: array
          items: { type: string }
        exposedFields:
          type: array
          items: { type: string }
        excludedFields:
          type: array
          items: { type: string }
        endpointFamilies:
          type: array
          items: { type: string }
    DataCatalogDomain:
      type: object
      additionalProperties: false
      required: [code, label, models, candidateScopes, candidateAvailability, endpointFamilies, includedFields, excludedFields]
      properties:
        code: { type: string }
        label: { type: string }
        models:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [model, availability]
            properties:
              model: { type: string }
              availability: { type: string, enum: [AVAILABLE, PLANNED, SENSITIVE, RESERVED, PROHIBITED] }
        candidateScopes:
          type: array
          items: { type: string }
        candidateAvailability: { type: string, enum: [AVAILABLE, PLANNED, SENSITIVE, RESERVED, PROHIBITED] }
        endpointFamilies:
          type: array
          items: { type: string }
        includedFields:
          type: array
          items: { type: string }
        excludedFields:
          type: array
          items: { type: string }
    CredentialEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, type, summary, createdAt]
            properties:
              id: { type: string }
              type: { type: string }
              reason: { type: [string, 'null'] }
              summary: { type: object, additionalProperties: true }
              actor:
                type: [object, 'null']
                properties:
                  id: { type: string }
                  name: { type: string }
              requestId: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
        page: { $ref: '#/components/schemas/PageMeta' }
    CredentialUsage:
      type: object
      additionalProperties: false
      required: [from, to, requests, rows, bytes, byStatus, byOperation]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        requests: { type: integer, minimum: 0 }
        rows: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
        byStatus: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        byOperation: { type: object, additionalProperties: { type: integer, minimum: 0 } }
    PlaygroundParameter:
      type: object
      additionalProperties: false
      required: [name, in, label, type, required]
      properties:
        name: { type: string }
        in: { type: string, enum: [query, path] }
        label: { type: string }
        type: { type: string, enum: [text, integer, datetime, date, boolean, enum-list] }
        required: { type: boolean }
        help: { type: string }
        min: { type: integer }
        max: { type: integer }
        maxLength: { type: integer }
        options: { type: array, items: { type: string } }
        advanced: { type: boolean }
        requiredScope: { type: string }
    PlaygroundDownloadCheck:
      type: object
      additionalProperties: false
      required: [kind, available, file, message]
      properties:
        kind: { const: DOWNLOAD_CHECK }
        available: { const: true }
        message: { type: string }
        file:
          type: object
          additionalProperties: false
          required: [id, mimeType, sizeBytes]
          properties:
            id: { type: string }
            mimeType: { type: string }
            sizeBytes: { type: integer, minimum: 0, maximum: 52428800 }
    PlaygroundResult:
      type: object
      additionalProperties: false
      required: [request, response]
      properties:
        request:
          type: object
          additionalProperties: false
          required: [method, path, authorization, curl]
          properties:
            method: { const: GET }
            path: { type: string }
            authorization: { type: string, example: 'Bearer ••••a9Qx' }
            curl: { type: string, description: Usa `$FILTRO_API_TOKEN`, nunca o valor real. }
        response:
          type: object
          additionalProperties: false
          required: [status, durationMs, requestId, truncated, body]
          properties:
            status: { type: integer }
            durationMs: { type: integer, minimum: 0 }
            requestId: { type: string }
            truncated: { type: boolean }
            body:
              description: Resposta JSON pública da consulta ou verificação de download, nunca arquivo binário/base64.
              anyOf:
                - $ref: '#/components/schemas/PlaygroundDownloadCheck'
                - type: object
                  not:
                    required: [kind]
                    properties:
                      kind: { const: DOWNLOAD_CHECK }

    PageMeta:
      type: object
      additionalProperties: false
      required: [nextCursor, limit, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer, minimum: 1 }
        hasMore: { type: boolean }
    IntegrationPageMeta:
      type: object
      additionalProperties: false
      required: [nextCursor, limit, hasMore, snapshotAt]
      properties:
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer, minimum: 1 }
        hasMore: { type: boolean }
        snapshotAt:
          type: string
          format: date-time
          description: Teto fixado na primeira página e preservado pelo cursor.
    ProjectRef:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    NatureRef:
      type: object
      additionalProperties: false
      required: [id, name, isActive]
      properties:
        id: { type: string }
        name: { type: string }
        isActive: { type: boolean }
    QualityEvidence:
      type: object
      additionalProperties: false
      required: [id, kind, label, fileName, mimeType, position, createdAt, downloadAvailable]
      properties:
        id: { type: string }
        kind: { type: string }
        label: { type: [string, 'null'] }
        fileName: { type: [string, 'null'] }
        mimeType: { type: [string, 'null'] }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
        downloadAvailable: { type: boolean }
    QualityRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - type
        - registeredAt
        - origin
        - project
        - eventDate
        - nature
        - description
        - impact
        - recurrence
        - linkedRnc
        - disposition
        - definedAction
        - actionOwner
        - actionDeadline
        - evidenceSummary
        - resultVerification
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        number: { type: string }
        type: { type: string }
        registeredAt: { type: string, format: date-time }
        origin: { type: [string, 'null'] }
        project:
          anyOf:
            - $ref: '#/components/schemas/ProjectRef'
            - type: 'null'
        eventDate: { type: string, format: date }
        nature:
          anyOf:
            - $ref: '#/components/schemas/NatureRef'
            - type: 'null'
        description: { type: [string, 'null'] }
        impact: { type: [string, 'null'] }
        recurrence:
          type: object
          additionalProperties: false
          required: [occurrences12m, recurrent]
          properties:
            occurrences12m: { type: integer, minimum: 0 }
            recurrent: { type: boolean }
        linkedRnc: { type: [string, 'null'] }
        disposition: { type: [string, 'null'] }
        definedAction: { type: [string, 'null'] }
        actionOwner: { type: [string, 'null'] }
        actionDeadline: { type: [string, 'null'], format: date }
        evidenceSummary: { type: [string, 'null'] }
        resultVerification: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        evidences:
          type: array
          description: Omitido sem `qualidade.evidencias.metadata.read`.
          items: { $ref: '#/components/schemas/QualityEvidence' }
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: Omitido sem `qualidade.excluidos.read`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QualityRecordPage:
      type: object
      additionalProperties: false
      required: [items, page, generatedAt, schemaVersion, requestId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QualityRecord' }
        page: { $ref: '#/components/schemas/IntegrationPageMeta' }
        generatedAt: { type: string, format: date-time }
        schemaVersion: { type: string, const: '1.0' }
        requestId: { type: string }
    QualityNature:
      type: object
      additionalProperties: false
      required: [id, name, isActive, position, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        isActive: { type: boolean }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QualityNaturePage:
      type: object
      additionalProperties: false
      required: [items, page, generatedAt, schemaVersion, requestId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QualityNature' }
        page: { $ref: '#/components/schemas/IntegrationPageMeta' }
        generatedAt: { type: string, format: date-time }
        schemaVersion: { type: string, const: '1.0' }
        requestId: { type: string }
