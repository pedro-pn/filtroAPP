components:
  securitySchemes:
    AdminSession:
      type: http
      scheme: bearer
      bearerFormat: FiltroApp human session
      description: Sessão existente de usuário; o servidor também exige `accountType=ADMIN`.
    IntegrationToken:
      type: http
      scheme: bearer
      bearerFormat: fva_selector_secret
      description: Credencial opaca externa, aceita somente sob `/integracoes/v1`.

  headers:
    NoStore:
      description: Resposta não deve ser armazenada
      schema: { type: string, const: no-store }
    NoCache:
      description: Compatibilidade adicional na revelação do segredo
      schema: { type: string, const: no-cache }
    RequestId:
      description: Identificador de correlação seguro
      schema: { type: string }
    PreferenceApplied:
      description: Presente em toda resposta simulada, inclusive erros. Ausente nas escritas reais.
      schema:
        type: string
        const: validate-only

  parameters:
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID por tentativa lógica; repetição nunca emite um segundo segredo.
      schema: { type: string, format: uuid }
    AdminCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 1000 }
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IntegrationCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2000 }
      description: Cursor opaco vinculado à operação, versão e filtros.
    IntegrationLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      description: Também limitado pelo `maxPageSize` da credencial.
    IntegrationReportType:
      name: reportType
      in: query
      style: form
      explode: false
      description: "Um ou mais tipos de relatório separados por vírgula. Exemplo para RCPUs: reportType=RCPU."
      schema:
        type: array
        items:
          type: string
          enum: [RDO, RDO_MAINTENANCE, RDO_PRODUCTION, RTP, RLQ, RCPU, RLM, RLF, RLI]
    PreferValidateOnly:
      in: header
      name: Prefer
      required: false
      description: validate-only executa as mesmas regras e desfaz toda a escrita. SIMULATE na credencial sempre prevalece.
      schema:
        type: string
        example: validate-only

  responses:
    AdminUnauthorized:
      description: Sessão humana ausente ou inválida
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminForbidden:
      description: Conta autenticada não é ADMIN
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidIntegrationToken:
      description: Token ausente, malformado, desconhecido, agendado, expirado ou revogado
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  code: { const: INVALID_TOKEN }
    Forbidden:
      description: Escopo, projeto, IP ou recurso não permitido
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Parâmetro ou corpo inválido
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    NotFound:
      description: Recurso inexistente ou invisível para a credencial
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Versão concorrente, idempotência repetida ou transição inválida
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Limite de requisições, linhas ou volume excedido
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  code: { const: RATE_LIMITED }
    SimulatedValidationError:
      description: Parâmetro ou corpo inválido
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Preference-Applied:
          $ref: "#/components/headers/PreferenceApplied"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    SimulatedInvalidIntegrationToken:
      description: Token ausente, malformado, desconhecido, agendado, expirado ou revogado
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Preference-Applied:
          $ref: "#/components/headers/PreferenceApplied"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  code:
                    const: INVALID_TOKEN
    SimulatedForbidden:
      description: Escopo, projeto, IP ou recurso não permitido
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Preference-Applied:
          $ref: "#/components/headers/PreferenceApplied"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SimulatedRateLimited:
      description: Limite de requisições, linhas ou volume excedido
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          schema:
