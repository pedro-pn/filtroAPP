          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: referenceDate
          in: query
          required: true
          description: Data de referência, inclusive, no formato AAAA-MM-DD.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Somente identificação do cargo, salário base mensal em BRL, início da vigência e versão.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [jobRoleId, jobRoleName, salary, effectiveDate, version]
                properties:
                  jobRoleId: { type: string }
                  jobRoleName: { type: string }
                  salary: { type: string, pattern: '^\d+(\.\d+)?$', description: Valor decimal em BRL, preservado como texto. }
                  effectiveDate: { type: string, format: date }
                  version: { type: integer, minimum: 1 }
              example: { jobRoleId: cargo_1, jobRoleName: Operador, salary: '4086.57', effectiveDate: '2026-07-01', version: 2 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidIntegrationToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Cargo inexistente (NOT_FOUND) ou salário não configurado na data (SALARY_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

