openapi: 3.1.0
info:
  title: FiltroApp - Administração e API de Integrações
  version: "1.10.0"
  description: >-
    Contrato da gestão administrativa de credenciais, consultas externas e escrita
    contratada do CRM Prisma no Efetivo. Tokens de integração e sessões humanas
    compartilham o esquema HTTP Bearer, mas têm formatos, middlewares e árvores de
    rota separados; um nunca substitui o outro.
servers:
  - url: /api
tags:
  - name: AdminApiScopes
  - name: AdminApiCredentials
  - name: AdminApiPlayground
  - name: IntegrationQuality
  - name: IntegrationOperational

paths:
  /admin/api-scopes:
    get:
      tags: [AdminApiScopes]
      operationId: listApiScopes
      summary: Lista o catálogo e a disponibilidade dos escopos
      security:
        - AdminSession: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: domain
          in: query
          schema: { type: string, maxLength: 80 }
        - name: availability
          in: query
          schema:
            type: string
            enum: [AVAILABLE, PLANNED, SENSITIVE, RESERVED, PROHIBITED]
      responses:
        '200':
          description: Catálogo completo, inclusive entradas não concedíveis
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [items, domains, operations, version]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScopeDefinition' }
                  domains:
                    type: array
                    items: { $ref: '#/components/schemas/DataCatalogDomain' }
                  version: { type: string, example: '1.0' }
                  operations:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - operationId
                        - label
                        - method
                        - path
                        - requiredScopes
                        - optionalScopes
                        - queryParams
                        - pathParams
                        - domain
                        - responseKind
                        - parameters
                        - bodyExample
                        - scopeAlternatives
                      properties:
                        operationId:
                          type: string
                        label:
                          type: string
                        method:
                          type: string
                          enum:
                            - GET
                            - POST
                        path:
                          type: string
                        requiredScopes:
                          type: array
                          items:
                            type: string
                        optionalScopes:
                          type: array
                          items:
                            type: string
                        domain:
                          type: string
                        responseKind:
                          type: string
                          enum:
                            - JSON
                            - DOWNLOAD_CHECK
                        parameters:
                          type: array
                          items:
                            $ref: "#/components/schemas/PlaygroundParameter"
                        queryParams:
                          type: array
                          items:
                            type: string
                        pathParams:
                          type: array
                          items:
                            type: string
                        bodyExample:
                          type:
                            - object
                            - "null"
                          additionalProperties: true
                        scopeAlternatives:
                          type: array
                          items:
                            type: array
                            items:
                              type: string
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }

  /admin/api-credentials:
    get:
      tags: [AdminApiCredentials]
      operationId: listApiCredentials
      summary: Lista credenciais sem segredos
      security:
        - AdminSession: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CredentialEffectiveStatus' }
        - name: scope
          in: query
          schema: { type: string, maxLength: 120 }
        - name: expiresBefore
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/AdminCursor'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: Página de credenciais
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPage'
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
    post:
      tags: [AdminApiCredentials]
      operationId: createApiCredential
      summary: Emite uma credencial e revela o segredo uma única vez
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCredentialInput' }
      responses:
        '201':
          description: Credencial emitida; `token` não volta a ser retornado
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedCredential' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/api-credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    get:
      tags: [AdminApiCredentials]
      operationId: getApiCredential
      summary: Obtém detalhe, sem segredo/verificador
      security:
        - AdminSession: []
      responses:
        '200':
          description: Detalhe da credencial
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCredential' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [AdminApiCredentials]
      operationId: reduceApiCredential
      summary: "Altera metadados, reduz privilégios ou troca writeMode com auditoria e versão"
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"oneOf":[{"$ref":"#/components/schemas/ReduceCredentialInput"},{"$ref":"#/components/schemas/UpdateCredentialWriteModeInput"}]}
      responses:
        '200':
          description: Credencial atualizada
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCredential' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/api-credentials/{credentialId}/rotate:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [AdminApiCredentials]
      operationId: rotateApiCredential
      summary: Cria credencial substituta e revela o novo segredo uma vez
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateCredentialInput' }
      responses:
        '201':
          description: Substituta criada
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedCredential' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/api-credentials/{credentialId}/revoke:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [AdminApiCredentials]
      operationId: revokeApiCredential
      summary: Revoga imediatamente uma credencial
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expectedVersion]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Credencial revogada
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCredential' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/api-credentials/{credentialId}/events:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
      - $ref: '#/components/parameters/AdminCursor'
      - $ref: '#/components/parameters/AdminLimit'
    get:
      tags: [AdminApiCredentials]
      operationId: listApiCredentialEvents
      summary: Lista eventos administrativos redigidos
      security:
        - AdminSession: []
      responses:
        '200':
          description: Página de eventos
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialEventPage' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/api-credentials/{credentialId}/usage:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    get:
      tags: [AdminApiCredentials]
      operationId: getApiCredentialUsage
      summary: Resume uso e falhas, sem conteúdo de respostas
      security:
        - AdminSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Resumo de uso
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialUsage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/api-credentials/{credentialId}/test:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [AdminApiPlayground]
      operationId: testApiCredentialOperation
      summary: Executa uma operação allowlisted com a política da credencial
      description: "Executa operações allowlisted com os mesmos escopos, projetos, regras e cotas. Escritas simulam por padrão; LIVE exige opção explícita e credencial LIVE. O console não comprova IP/segredo Bearer. Downloads verificam disponibilidade sem transferir arquivos."
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - operationId
                - query
              properties:
                operationId:
                  type: string
                  enum:
                    - quality.records.create
                    - acompanhamento.opportunities.post
                    - acompanhamento.opportunities.links.list
                    - acompanhamento.opportunities.get
                    - jobRoles.salary.get
                    - quality.records.list
                    - quality.records.get
                    - quality.natures.list
                    - quality.evidence.download
                    - efetivo.projects.status.get
                    - efetivo.projects.create
                    - efetivo.projects.commercialFact.post
                    - efetivo.projects.document.post
                    - operational.Collaborator.list
                    - operational.JobRole.list
                    - operational.Project.list
                    - operational.ClientSegment.list
                    - operational.Report.list
                    - operational.DdsTheme.list
                    - operational.MaintenanceRecord.list
                    - operational.MaintenanceProfile.list
                    - operational.MaintenanceProfileItem.list
                    - operational.ChemicalCleaning.list
                    - operational.CompanyEquipment.list
                    - operational.Equipment.list
                    - operational.EquipmentCategory.list
                    - operational.StockItem.list
                    - operational.StockCategory.list
                    - operational.ReportVersion.list
                    - operational.ReportCollaborator.list
                    - operational.ReportService.list
                    - operational.ReportAttachment.list
                    - operational.ReportSignature.list
                    - operational.ReportAuditLog.list
                    - operational.StockBatch.list
                    - operational.StockMovement.list
                    - operational.StockItemDocument.list
                    - operational.StockMovementCosts.list
                    - operational.MaintenanceThirdPartyService.list
                    - operational.MaintenanceAttachment.list
                    - operational.OperationalReviewAudit.list
                    - integration.events.list
                    - operational.ProjectResponsible.list
                    - efetivo.projects.status.list
                    - operational.ReportAttachment.download
                    - operational.StockItemDocument.download
                    - operational.MaintenanceAttachment.download
                    - efetivo.projects.measurement.get
                    - logistics.unloadings.create
                    - efetivo.projects.measurements.list
                    - operational.OmieInvoice.list
                    - operational.Romaneio.list
                    - operational.ProjectPending.list
                    - operational.LogisticsUnloading.list
                pathParams:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 100
                  default: {}
                query:
                  type: object
                  additionalProperties: true
                body:
                  type: object
                  additionalProperties: true
                headers:
                  type: object
                  additionalProperties: false
                  required:
                    - Idempotency-Key
                  properties:
                    Idempotency-Key:
                      type: string
                      format: uuid
                writeMode:
                  type: string
                  enum:
                    - LIVE
                    - SIMULATE
                  default: SIMULATE
                  description: Escritas simuladas por padrão. LIVE solicita persistência somente em credencial LIVE.
      responses:
        '200':
          description: Requisição redigida e resposta limitada para visualização
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaygroundResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/qualidade/registros:
    get:
      tags:
        - IntegrationQuality
      operationId: qualityRecordsList
      summary: Lista registros de Qualidade para carga ou sincronização
      security:
        - IntegrationToken: []
      x-required-scopes:
        - qualidade.registros.read
      x-conditional-scopes:
        qualidade.evidencias.metadata.read: inclui o array `evidences`
        qualidade.excluidos.read: obrigatório quando `includeDeleted=true`
      parameters:
        - $ref: "#/components/parameters/IntegrationCursor"
        - $ref: "#/components/parameters/IntegrationLimit"
        - name: updatedSince
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedUntil
          in: query
          schema:
            type: string
            format: date-time
        - name: snapshotAt
          in: query
          schema:
            type: string
            format: date-time
        - name: projectId
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Identificador interno mantido para compatibilidade; não combine com projectCode.
        - name: projectCode
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Código cadastrado do projeto, tratado como texto e com zeros à esquerda preservados; não combine com projectId.
        - name: type
          in: query
          schema:
            type: string
            maxLength: 40
        - name: status
          in: query
          schema:
            type: string
            maxLength: 40
        - name: natureId
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: eventDateFrom
          in: query
          schema:
            type: string
            format: date
        - name: eventDateTo
          in: query
          schema:
            type: string
            format: date
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
          description: Exige também `qualidade.excluidos.read` quando true
      responses:
        "200":
          description: Página ordenada por `updatedAt`, `id`
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityRecordPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidIntegrationToken"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - IntegrationQuality
      operationId: qualityRecordCreate
      summary: Abrir registro de Qualidade pelo Omni
      security:
        - IntegrationToken: []
      x-required-scopes:
        - qualidade.registros.create
      description: "Cria EM_TRIAGEM sem natureza, origem fixa OMNI, FK de User ativo e actionOwner textual. Idempotência por credencial e chave sem expiração: mesmo corpo/chave retorna o mesmo 201; outro corpo retorna 409. Trilha de Qualidade registra credencial e origem; evento transacional qualidade.criado. Projeto dentro do recorte. externalRef persistida internamente."
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PreferValidateOnly"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - type
                - eventDate
                - description
                - impact
                - actionOwnerEmail
                - externalRef
              oneOf:
                - required:
                    - projectCode
                - required:
                    - projectId
              properties:
                type:
                  type: string
                  enum:
                    - DESVIO
                    - INCIDENTE
                    - RECLAMACAO_CLIENTE
                projectCode:
                  type: string
                  minLength: 1
                  maxLength: 100
                projectId:
                  type: string
                  minLength: 1
                  maxLength: 100
                eventDate:
                  type: string
                  format: date
                description:
                  type: string
                  minLength: 1
                  maxLength: 10000
                impact:
                  type: string
                  enum:
                    - ALTO
                    - MEDIO
                    - BAIXO
                actionOwnerEmail:
                  type: string
                  format: email
                  maxLength: 254
                externalRef:
                  type: object
                  additionalProperties: false
                  required:
                    - system
                    - url
                    - reference
                  properties:
                    system:
                      type: string
                      minLength: 1
                      maxLength: 100
                    url:
                      type: string
                      format: uri
                      pattern: ^https?://
                      maxLength: 2000
                    reference:
                      type: string
                      minLength: 1
                      maxLength: 500
              example:
                type: DESVIO
                projectCode: "5850"
                eventDate: 2026-10-28
                description: "Mobilização adiada: exemplo fictício."
                impact: MEDIO
                actionOwnerEmail: qualidade@filtrovali.com.br
                externalRef:
                  system: omni
                  url: https://omni.filtrovali.com.br/exemplo
                  reference: pergunta-ficticia
      responses:
        "201":
          description: Registro criado ou resposta original de reenvio idempotente.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - id
                  - number
                  - status
                  - createdAt
                properties:
                  id:
                    type: string
                  number:
                    type: string
                    example: D-012/26
                  status:
                    const: EM_TRIAGEM
                  createdAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/SimulatedValidationError"
        "401":
          $ref: "#/components/responses/SimulatedInvalidIntegrationToken"
        "403":
          $ref: "#/components/responses/SimulatedForbidden"
        "404":
          description: Projeto inexistente ou indisponível.
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        "409":
          description: "IDEMPOTENCY_CONFLICT: chave já usada com outro corpo."
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        "422":
          description: "ACTION_OWNER_NOT_FOUND: email não identifica um único User ativo."
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        "429":
          $ref: "#/components/responses/SimulatedRateLimited"
        "200":
          description: Simulação validada; nenhuma escrita de domínio persistida. LIVE conserva sua resposta anterior.
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatedWriteResult"
        "501":
          $ref: "#/components/responses/SimulationNotSupported"

  /integracoes/v1/qualidade/registros/{recordId}:
    get:
      tags: [IntegrationQuality]
      operationId: qualityRecordGet
      summary: Obtém um registro permitido
      security:
        - IntegrationToken: []
      x-required-scopes: [qualidade.registros.read]
      x-conditional-scopes:
        qualidade.evidencias.metadata.read: inclui o array `evidences`
        qualidade.excluidos.read: obrigatório quando `includeDeleted=true`
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Registro público
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityRecord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidIntegrationToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/qualidade/naturezas:
    get:
      tags: [IntegrationQuality]
      operationId: qualityNaturesList
      summary: Lista naturezas de Qualidade
      security:
        - IntegrationToken: []
      x-required-scopes: [qualidade.naturezas.read]
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
        - name: updatedSince
          in: query
          schema: { type: string, format: date-time }
        - name: snapshotAt
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/IntegrationCursor'
        - $ref: '#/components/parameters/IntegrationLimit'
      responses:
        '200':
          description: Página de naturezas
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityNaturePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidIntegrationToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/qualidade/evidencias/{evidenceId}/download:
    get:
      tags: [IntegrationQuality]
      operationId: qualityEvidenceDownload
      summary: Baixa evidência de um registro permitido
      security:
        - IntegrationToken: []
      x-required-scopes:
        - qualidade.registros.read
        - qualidade.evidencias.metadata.read
        - qualidade.evidencias.download
      parameters:
