openapi: 3.1.0
info:
  title: FiltroApp - Administração e API de Integrações
  version: 1.3.1
  description: >-
    Contrato da gestão administrativa de credenciais e da primeira versão externa,
    somente leitura, de Qualidade e dos cadastros/coleções operacionais publicados. Tokens de integração e sessões humanas
    compartilham o esquema HTTP Bearer, mas têm formatos, middlewares e árvores de
    rota separados; um nunca substitui o outro.
servers:
  - url: /api
tags:
  - name: AdminApiScopes
  - name: AdminApiCredentials
  - name: AdminApiPlayground
  - name: IntegrationQuality
  - name: IntegrationOperational

paths:
  /admin/api-scopes:
    get:
      tags: [AdminApiScopes]
      operationId: listApiScopes
      summary: Lista o catálogo e a disponibilidade dos escopos
      security:
        - AdminSession: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: domain
          in: query
          schema: { type: string, maxLength: 80 }
        - name: availability
          in: query
          schema:
            type: string
            enum: [AVAILABLE, PLANNED, SENSITIVE, RESERVED, PROHIBITED]
      responses:
        '200':
          description: Catálogo completo, inclusive entradas não concedíveis
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [items, domains, operations, version]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScopeDefinition' }
                  domains:
                    type: array
                    items: { $ref: '#/components/schemas/DataCatalogDomain' }
                  version: { type: string, example: '1.0' }
                  operations:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [operationId, label, method, path, requiredScopes, optionalScopes, queryParams, pathParams, domain, responseKind, parameters]
                      properties:
                        operationId: { type: string }
                        label: { type: string }
                        method: { const: GET }
                        path: { type: string }
                        requiredScopes: { type: array, items: { type: string } }
                        optionalScopes: { type: array, items: { type: string } }
                        domain: { type: string }
                        responseKind: { type: string, enum: [JSON, DOWNLOAD_CHECK] }
                        parameters: { type: array, items: { $ref: '#/components/schemas/PlaygroundParameter' } }
                        queryParams: { type: array, items: { type: string } }
                        pathParams: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }

  /admin/api-credentials:
    get:
      tags: [AdminApiCredentials]
      operationId: listApiCredentials
      summary: Lista credenciais sem segredos
      security:
        - AdminSession: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CredentialEffectiveStatus' }
        - name: scope
          in: query
          schema: { type: string, maxLength: 120 }
        - name: expiresBefore
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/AdminCursor'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: Página de credenciais
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPage'
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
    post:
      tags: [AdminApiCredentials]
      operationId: createApiCredential
      summary: Emite uma credencial e revela o segredo uma única vez
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCredentialInput' }
      responses:
        '201':
          description: Credencial emitida; `token` não volta a ser retornado
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedCredential' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/api-credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    get:
      tags: [AdminApiCredentials]
      operationId: getApiCredential
      summary: Obtém detalhe, sem segredo/verificador
      security:
        - AdminSession: []
      responses:
        '200':
          description: Detalhe da credencial
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCredential' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [AdminApiCredentials]
      operationId: reduceApiCredential
      summary: Altera metadados ou reduz privilégios; nunca amplia
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReduceCredentialInput' }
      responses:
        '200':
          description: Credencial atualizada
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCredential' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/api-credentials/{credentialId}/rotate:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [AdminApiCredentials]
      operationId: rotateApiCredential
      summary: Cria credencial substituta e revela o novo segredo uma vez
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateCredentialInput' }
      responses:
        '201':
          description: Substituta criada
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedCredential' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/api-credentials/{credentialId}/revoke:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [AdminApiCredentials]
      operationId: revokeApiCredential
      summary: Revoga imediatamente uma credencial
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expectedVersion]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Credencial revogada
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCredential' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/api-credentials/{credentialId}/events:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
      - $ref: '#/components/parameters/AdminCursor'
      - $ref: '#/components/parameters/AdminLimit'
    get:
      tags: [AdminApiCredentials]
      operationId: listApiCredentialEvents
      summary: Lista eventos administrativos redigidos
      security:
        - AdminSession: []
      responses:
        '200':
          description: Página de eventos
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialEventPage' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/api-credentials/{credentialId}/usage:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    get:
      tags: [AdminApiCredentials]
      operationId: getApiCredentialUsage
      summary: Resume uso e falhas, sem conteúdo de respostas
      security:
        - AdminSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Resumo de uso
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialUsage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/api-credentials/{credentialId}/test:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [AdminApiPlayground]
      operationId: testApiCredentialOperation
      summary: Simula uma operação allowlisted com a política da credencial
      description: >-
        Não aceita URL, método, headers ou corpo livres. Aplica o mesmo catálogo,
        escopos, projetos, filtros e limites da API externa e registra evento TESTED.
        Não simula um IP arbitrário; a allowlist de rede só é comprovada por chamada
        real do consumidor.
        Downloads retornam verificação JSON de acesso/disponibilidade (DOWNLOAD_CHECK),
        sem transmitir o arquivo, seu caminho, URL pública ou conteúdo.
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId, query]
              properties:
                operationId:
                  type: string
                  enum:
                    - quality.records.list
                    - quality.records.get
                    - quality.natures.list
                    - quality.evidence.download
                    - operational.ReportAttachment.download
                    - operational.StockItemDocument.download
                    - operational.MaintenanceAttachment.download
                    - operational.Collaborator.list
                    - operational.JobRole.list
                    - operational.Project.list
                    - operational.ClientSegment.list
                    - operational.Report.list
                    - operational.DdsTheme.list
                    - operational.MaintenanceRecord.list
                    - operational.MaintenanceProfile.list
                    - operational.MaintenanceProfileItem.list
                    - operational.ChemicalCleaning.list
                    - operational.CompanyEquipment.list
                    - operational.Equipment.list
                    - operational.EquipmentCategory.list
                    - operational.StockItem.list
                    - operational.StockCategory.list
                    - operational.ReportVersion.list
                    - operational.ReportCollaborator.list
                    - operational.ReportService.list
                    - operational.ReportAttachment.list
                    - operational.ReportSignature.list
                    - operational.ReportAuditLog.list
                    - operational.StockBatch.list
                    - operational.StockMovement.list
                    - operational.StockItemDocument.list
                    - operational.StockMovementCosts.list
                    - operational.MaintenanceThirdPartyService.list
                    - operational.MaintenanceAttachment.list
                    - operational.OperationalReviewAudit.list
                pathParams:
                  type: object
                  additionalProperties: { type: string, maxLength: 100 }
                  default: {}
                query:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Requisição redigida e resposta limitada para visualização
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaygroundResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/qualidade/registros:
    get:
      tags: [IntegrationQuality]
      operationId: qualityRecordsList
      summary: Lista registros de Qualidade para carga ou sincronização
      security:
        - IntegrationToken: []
      x-required-scopes: [qualidade.registros.read]
      x-conditional-scopes:
        qualidade.evidencias.metadata.read: inclui o array `evidences`
        qualidade.excluidos.read: obrigatório quando `includeDeleted=true`
      parameters:
        - $ref: '#/components/parameters/IntegrationCursor'
        - $ref: '#/components/parameters/IntegrationLimit'
        - name: updatedSince
          in: query
          schema: { type: string, format: date-time }
        - name: updatedUntil
          in: query
          schema: { type: string, format: date-time }
        - name: snapshotAt
          in: query
          schema: { type: string, format: date-time }
        - name: projectId
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: Identificador interno mantido para compatibilidade; não combine com projectCode.
        - name: projectCode
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: Código cadastrado do projeto, tratado como texto e com zeros à esquerda preservados; não combine com projectId.
        - name: type
          in: query
          schema: { type: string, maxLength: 40 }
        - name: status
          in: query
          schema: { type: string, maxLength: 40 }
        - name: natureId
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: eventDateFrom
          in: query
          schema: { type: string, format: date }
        - name: eventDateTo
          in: query
          schema: { type: string, format: date }
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
          description: Exige também `qualidade.excluidos.read` quando true
      responses:
        '200':
          description: Página ordenada por `updatedAt`, `id`
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityRecordPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidIntegrationToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/qualidade/registros/{recordId}:
    get:
      tags: [IntegrationQuality]
      operationId: qualityRecordGet
      summary: Obtém um registro permitido
      security:
        - IntegrationToken: []
      x-required-scopes: [qualidade.registros.read]
      x-conditional-scopes:
        qualidade.evidencias.metadata.read: inclui o array `evidences`
        qualidade.excluidos.read: obrigatório quando `includeDeleted=true`
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Registro público
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityRecord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidIntegrationToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/qualidade/naturezas:
    get:
      tags: [IntegrationQuality]
      operationId: qualityNaturesList
      summary: Lista naturezas de Qualidade
      security:
        - IntegrationToken: []
      x-required-scopes: [qualidade.naturezas.read]
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
        - name: updatedSince
          in: query
          schema: { type: string, format: date-time }
        - name: snapshotAt
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/IntegrationCursor'
        - $ref: '#/components/parameters/IntegrationLimit'
      responses:
        '200':
          description: Página de naturezas
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityNaturePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidIntegrationToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/qualidade/evidencias/{evidenceId}/download:
    get:
      tags: [IntegrationQuality]
      operationId: qualityEvidenceDownload
      summary: Baixa evidência de um registro permitido
      security:
        - IntegrationToken: []
      x-required-scopes:
        - qualidade.registros.read
        - qualidade.evidencias.metadata.read
        - qualidade.evidencias.download
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Arquivo, sem revelar caminho ou token público
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/InvalidIntegrationToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/colaboradores:
    get:
      tags: [IntegrationOperational]
      operationId: listIntegrationCollaborator
      summary: "Colaboradores — identificação operacional"
      description: "Com projetos selecionados, inclui somente colaboradores de equipes de relatórios aprovados desses projetos; não representa alocação atual."
      security: [{ IntegrationToken: [] }]
      x-required-scopes: [colaboradores.operacional.read]
      parameters: [{"$ref":"#/components/parameters/IntegrationLimit"},{"$ref":"#/components/parameters/IntegrationCursor"},{"name":"updatedSince","in":"query","schema":{"type":"string","format":"date-time"}},{"name":"snapshotAt","in":"query","schema":{"type":"string","format":"date-time"}},{"name":"projectId","in":"query","schema":{"type":"string","minLength":1,"maxLength":100},"description":"Identificador interno mantido para compatibilidade; nao combine com projectCode."},{"name":"projectCode","in":"query","schema":{"type":"string","minLength":1,"maxLength":100},"description":"Codigo cadastrado do projeto, tratado como texto e com zeros a esquerda preservados; nao combine com projectId."},{"name":"active","in":"query","schema":{"type":"boolean"}}]
      responses:
        '200':
          description: Página operacional por updatedAt e id, sem campos não contratados.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page, generatedAt, schemaVersion, requestId]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: ["id","createdAt","updatedAt","code","name","jobRoleId","isActive"]
                      properties: {"id":{"type":"string"},"createdAt":{"type":"string","format":"date-time"},"updatedAt":{"type":"string","format":"date-time"},"code":{"type":"string"},"name":{"type":"string"},"jobRoleId":{"type":"string"},"isActive":{"type":"boolean"}}
                  page: { $ref: '#/components/schemas/IntegrationPageMeta' }
                  generatedAt: { type: string, format: date-time }
                  schemaVersion: { type: string, const: '1.0' }
                  requestId: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidIntegrationToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/cargos:
    get:
      tags: [IntegrationOperational]
      operationId: listIntegrationJobRole
      summary: "Cargos"
      description: "Cadastro global compartilhado; não é limitado por projeto."
      security: [{ IntegrationToken: [] }]
      x-required-scopes: [cargos.read]
      parameters: [{"$ref":"#/components/parameters/IntegrationLimit"},{"$ref":"#/components/parameters/IntegrationCursor"},{"name":"updatedSince","in":"query","schema":{"type":"string","format":"date-time"}},{"name":"snapshotAt","in":"query","schema":{"type":"string","format":"date-time"}},{"name":"active","in":"query","schema":{"type":"boolean"}}]
      responses:
        '200':
          description: Página operacional por updatedAt e id, sem campos não contratados.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page, generatedAt, schemaVersion, requestId]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: ["id","createdAt","updatedAt","name","isActive","isOperational"]
                      properties: {"id":{"type":"string"},"createdAt":{"type":"string","format":"date-time"},"updatedAt":{"type":"string","format":"date-time"},"name":{"type":"string"},"isActive":{"type":"boolean"},"isOperational":{"type":"boolean"}}
                  page: { $ref: '#/components/schemas/IntegrationPageMeta' }
                  generatedAt: { type: string, format: date-time }
                  schemaVersion: { type: string, const: '1.0' }
                  requestId: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidIntegrationToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integracoes/v1/projetos:
    get:
      tags: [IntegrationOperational]
      operationId: listIntegrationProject
      summary: "Projetos — dados operacionais"
      description: "Somente projetos autorizados e não excluídos."
      security: [{ IntegrationToken: [] }]
      x-required-scopes: [projetos.read]
      parameters: [{"$ref":"#/components/parameters/IntegrationLimit"},{"$ref":"#/components/parameters/IntegrationCursor"},{"name":"updatedSince","in":"query","schema":{"type":"string","format":"date-time"}},{"name":"snapshotAt","in":"query","schema":{"type":"string","format":"date-time"}},{"name":"projectId","in":"query","schema":{"type":"string","minLength":1,"maxLength":100},"description":"Identificador interno mantido para compatibilidade; nao combine com projectCode."},{"name":"projectCode","in":"query","schema":{"type":"string","minLength":1,"maxLength":100},"description":"Codigo cadastrado do projeto, tratado como texto e com zeros a esquerda preservados; nao combine com projectId."},{"name":"active","in":"query","schema":{"type":"boolean"}}]
