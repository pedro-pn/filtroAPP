name: filtrovali

services:
  postgres:
    image: postgres:16-alpine
    container_name: filtrovali-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - idle_in_transaction_session_timeout=60000
    environment:
      POSTGRES_DB: filtrovali
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - filtrovali_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d filtrovali"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.25
    pids_limit: 200
    networks:
      - filtrovali-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: filtrovali-backend
    restart: unless-stopped
    env_file:
      - backend/.env.production
    environment:
      BACKGROUND_JOBS_IN_API: "false"
      DATABASE_CONNECTION_LIMIT: ${BACKEND_DATABASE_CONNECTION_LIMIT:-8}
      PRISMA_SLOW_QUERY_MS: ${PRISMA_SLOW_QUERY_MS:-1000}
      SLOW_OPERATION_LOG_MS: ${SLOW_OPERATION_LOG_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - filtrovali_relatorios:/data/relatorios
      - ${OPERATIONS_STATUS_DIR:-/root/backups/filtrovali/status}:/ops-status:ro
    networks:
      - filtrovali-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 200

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: filtrovali-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - backend/.env.production
    environment:
      BACKGROUND_JOBS_IN_API: "false"
      DATABASE_CONNECTION_LIMIT: ${WORKER_DATABASE_CONNECTION_LIMIT:-2}
      PRISMA_SLOW_QUERY_MS: ${PRISMA_SLOW_QUERY_MS:-1000}
      SLOW_OPERATION_LOG_MS: ${SLOW_OPERATION_LOG_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - filtrovali_relatorios:/data/relatorios
      - ${OPERATIONS_STATUS_DIR:-/root/backups/filtrovali/status}:/ops-status:ro
    networks:
      - filtrovali-net
    mem_limit: 1536m
    cpus: 0.75
    pids_limit: 150

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_ERROR_TRACKING_ENABLED: ${VITE_ERROR_TRACKING_ENABLED:-false}
        VITE_ERROR_TRACKING_ENDPOINT: ${VITE_ERROR_TRACKING_ENDPOINT:-}
    container_name: filtrovali-nginx
    restart: unless-stopped
    depends_on:
      - backend
    # Portas 80/443 agora pertencem ao infra-proxy (deploy/infra-proxy/).
    # Este nginx so e alcancado pelo Caddy, via proxy-net.
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - filtrovali_certs:/etc/letsencrypt
      - filtrovali_certbot_www:/var/www/certbot
    networks:
      - filtrovali-net
      - proxy-net
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100

volumes:
  filtrovali_pgdata:
    name: filtrovali_pgdata
    external: true
  filtrovali_relatorios:
    name: filtrovali_relatorios
    external: true
  filtrovali_certs:
    name: filtrovali_certs
    external: true
  filtrovali_certbot_www:
    name: filtrovali_certbot_www
    external: true

networks:
  filtrovali-net:
    name: filtrovali-net
    driver: bridge
  proxy-net:
    name: proxy-net
    external: true
