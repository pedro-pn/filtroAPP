name: filtrovali-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: filtrovali-staging-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - idle_in_transaction_session_timeout=60000
    environment:
      POSTGRES_DB: filtrovali
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required. Use --env-file backend/.env.staging or export it before running docker compose.}
    volumes:
      - filtrovali_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d filtrovali"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.25
    pids_limit: 200
    networks:
      - filtrovali-staging-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: filtrovali-staging-backend
    restart: unless-stopped
    env_file:
      - backend/.env.staging
    environment:
      BACKGROUND_JOBS_IN_API: "false"
      ASSINATURAS_MAX_PDF_MB: "200"
      APP_ENV: staging
      SEND_CLIENT_EMAILS: "false"
      COMERCIALAPP_ALLOW_STAGING_HTTP: ${COMERCIALAPP_ALLOW_STAGING_HTTP:-false}
      DATABASE_CONNECTION_LIMIT: ${BACKEND_DATABASE_CONNECTION_LIMIT:-8}
      PRISMA_SLOW_QUERY_MS: ${PRISMA_SLOW_QUERY_MS:-1000}
      SLOW_OPERATION_LOG_MS: ${SLOW_OPERATION_LOG_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - filtrovali_staging_relatorios:/data/relatorios
      - ${STAGING_OPERATIONS_STATUS_DIR:-/root/backups/filtrovali-staging/status}:/ops-status:ro
    networks:
      - filtrovali-staging-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 200

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: filtrovali-staging-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - backend/.env.staging
    environment:
      BACKGROUND_JOBS_IN_API: "false"
      ASSINATURAS_MAX_PDF_MB: "200"
      APP_ENV: staging
      SEND_CLIENT_EMAILS: "false"
      COMERCIALAPP_ALLOW_STAGING_HTTP: ${COMERCIALAPP_ALLOW_STAGING_HTTP:-false}
      DATABASE_CONNECTION_LIMIT: ${WORKER_DATABASE_CONNECTION_LIMIT:-2}
      PRISMA_SLOW_QUERY_MS: ${PRISMA_SLOW_QUERY_MS:-1000}
      SLOW_OPERATION_LOG_MS: ${SLOW_OPERATION_LOG_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - filtrovali_staging_relatorios:/data/relatorios
      - ${STAGING_OPERATIONS_STATUS_DIR:-/root/backups/filtrovali-staging/status}:/ops-status:ro
    networks:
      - filtrovali-staging-net
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker-health.js"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3
    mem_limit: 1536m
    cpus: 0.75
    pids_limit: 150

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_ERROR_TRACKING_ENABLED: ${VITE_ERROR_TRACKING_ENABLED:-false}
        VITE_ERROR_TRACKING_ENDPOINT: ${VITE_ERROR_TRACKING_ENDPOINT:-}
    container_name: filtrovali-staging-nginx
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      STAGING_ALLOWED_IPS: ${STAGING_ALLOWED_IPS:-}
    volumes:
      - ./deploy/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/15-staging-allowlist.sh:/docker-entrypoint.d/15-staging-allowlist.sh:ro
    networks:
      - filtrovali-staging-net
      - proxy-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100

volumes:
  filtrovali_staging_pgdata:
    name: filtrovali_staging_pgdata
  filtrovali_staging_relatorios:
    name: filtrovali_staging_relatorios

networks:
  filtrovali-staging-net:
    name: filtrovali-staging-net
    driver: bridge
  proxy-net:
    name: proxy-net
    external: true
